<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    @font-face{font-family:Space;src:url('assets/fonts/space-grotesk-600.ttf')}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#070910;color:#fff;font-family:Space,system-ui,sans-serif}.screen{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 43%,#22283a 0,transparent 32%),#070910}.content{display:grid;justify-items:center;gap:18px}.brand{font-size:clamp(38px,4vw,66px);letter-spacing:-.07em}.track{width:min(280px,38vw);height:4px;overflow:hidden;border-radius:99px;background:#ffffff1c}.track i{display:block;width:38%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#8b7bff,#fff);animation:move 1.05s cubic-bezier(.55,.05,.45,.95) infinite}.label{color:#aeb6ca;font:500 13px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase}@keyframes move{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}@media(prefers-reduced-motion:reduce){.track i{animation-duration:2.4s}}
  </style>
</head>
<body><div class="screen"><div class="content"><div class="brand">RaspyTV</div><div class="track"><i></i></div><div class="label" data-label>Chargement</div></div></div></body>
</html>
