<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clavier RaspyTV</title><link rel="stylesheet" href="keyboard.css"></head>
<body><main class="keyboard" aria-label="Clavier virtuel">
  <header><strong>Clavier</strong><div class="modes" role="group" aria-label="Mode du clavier"><button class="active" data-layer="letters">ABC</button><button data-layer="symbols">?123</button></div><span>AZERTY · hors ligne</span><button class="close-keyboard" data-action="close" aria-label="Fermer le clavier">Fermer ×</button></header>
  <div class="keys" id="letters">
    <div class="row"><button data-value="&amp;" data-shift="1">&amp;<small>1</small></button><button data-value="é" data-shift="2">é<small>2</small></button><button data-value="&quot;" data-shift="3">&quot;<small>3</small></button><button data-value="'" data-shift="4">'<small>4</small></button><button data-value="(" data-shift="5">(<small>5</small></button><button data-value="-" data-shift="6">-<small>6</small></button><button data-value="è" data-shift="7">è<small>7</small></button><button data-value="_" data-shift="8">_<small>8</small></button><button data-value="ç" data-shift="9">ç<small>9</small></button><button data-value="à" data-shift="0">à<small>0</small></button><button data-value=")" data-shift="°">)<small>°</small></button><button data-value="=" data-shift="+">=<small>+</small></button><button class="wide" data-key="backspace">⌫</button></div>
    <div class="row"><button class="modifier" data-key="tab">Tab</button><button data-value="a">A</button><button data-value="z">Z</button><button data-value="e">E</button><button data-value="r">R</button><button data-value="t">T</button><button data-value="y">Y</button><button data-value="u">U</button><button data-value="i">I</button><button data-value="o">O</button><button data-value="p">P</button><button data-value="^" data-shift="¨">^</button><button data-value="$" data-shift="£">$</button></div>
    <div class="row"><button class="modifier wide" data-action="caps">Verr. Maj</button><button data-value="q">Q</button><button data-value="s">S</button><button data-value="d">D</button><button data-value="f">F</button><button data-value="g">G</button><button data-value="h">H</button><button data-value="j">J</button><button data-value="k">K</button><button data-value="l">L</button><button data-value="m">M</button><button data-value="ù" data-shift="%">ù</button><button class="modifier wide" data-key="enter">Entrée</button></div>
    <div class="row"><button class="modifier wide" data-action="shift">⇧ Maj</button><button data-value="<" data-shift=">">&lt;</button><button data-value="w">W</button><button data-value="x">X</button><button data-value="c">C</button><button data-value="v">V</button><button data-value="b">B</button><button data-value="n">N</button><button data-value="," data-shift="?">,</button><button data-value=";" data-shift=".">;</button><button data-value=":" data-shift="/">:</button><button data-value="!" data-shift="§">!</button><button class="modifier wide" data-key="delete">Suppr</button></div>
    <div class="row bottom"><button class="modifier" data-layer="symbols">?123</button><button data-value="/">/</button><button data-value="@">@</button><button data-value=".fr">.fr</button><button data-value=".com">.com</button><button class="space" data-value=" ">Espace</button><button data-key="left">←</button><button data-key="right">→</button><button class="done" data-action="close">Terminé</button></div>
  </div>
  <div class="keys" id="symbols" hidden>
    <div class="row"><button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button data-value="0">0</button><button class="wide" data-key="backspace">⌫</button></div>
    <div class="row"><button data-value="@">@</button><button data-value="#">#</button><button data-value="€">€</button><button data-value="_">_</button><button data-value="&amp;">&amp;</button><button data-value="-">-</button><button data-value="+">+</button><button data-value="=">=</button><button data-value="(">(</button><button data-value=")">)</button><button data-value="[">[</button><button data-value="]">]</button></div>
    <div class="row"><button data-value="/">/</button><button data-value="\">\</button><button data-value=":">:</button><button data-value=";">;</button><button data-value="&quot;">&quot;</button><button data-value="'">'</button><button data-value="?">?</button><button data-value="!">!</button><button data-value="*">*</button><button data-value="%">%</button><button class="modifier wide" data-key="enter">Entrée</button></div>
    <div class="row"><button data-value=".">.</button><button data-value=",">,</button><button data-value="&lt;">&lt;</button><button data-value="&gt;">&gt;</button><button data-value="{">{</button><button data-value="}">}</button><button data-value="|">|</button><button data-value="~">~</button><button data-value="`">`</button><button data-value="^">^</button><button class="modifier wide" data-key="delete">Suppr</button></div>
    <div class="row bottom"><button class="modifier wide" data-layer="letters">ABC</button><button data-value=".fr">.fr</button><button data-value=".com">.com</button><button class="space" data-value=" ">Espace</button><button data-key="left">←</button><button data-key="up">↑</button><button data-key="down">↓</button><button data-key="right">→</button><button class="done" data-action="close">Terminé</button></div>
  </div>
</main><script src="keyboard.js"></script></body></html>
