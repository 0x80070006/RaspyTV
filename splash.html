<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#03050b;color:#f8f9ff;cursor:none}
    body{display:grid;place-items:center;font-family:'Space Grotesk','DM Sans',system-ui,sans-serif}
    strong{font-size:clamp(46px,5vw,82px);font-weight:600;line-height:1;letter-spacing:-.065em;opacity:0;animation:appear 320ms ease-out 40ms forwards}
    @keyframes appear{to{opacity:1}}
    @media(prefers-reduced-motion:reduce){strong{animation:none;opacity:1}}
  </style>
</head>
<body><strong>RaspyTV</strong></body>
</html>
